<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парсинг XML</title>
    <link rel="stylesheet" href="styles_parser.css">
</head>
<body>
    <h2>Введите номер книги:</h2>
    <input type="number" id="bookIndex">
    <button onclick="loadXML()">Показать</button>
    <h3>Результат:</h3>
    <div id="output"></div>

    <script>
        function loadXML() {
            let xhr = new XMLHttpRequest();
            xhr.open("GET", "book.xml", true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    parseXML(xhr.responseXML);
                }
            };
            xhr.send();
        }

        function parseXML(xml) {
            let index = parseInt(document.getElementById("bookIndex").value, 10);
            let books = xml.getElementsByTagName("book");
            let bookCount = books.length;
            let outputDiv = document.getElementById("output");
            outputDiv.innerHTML = "";

            if (index === 0 || isNaN(index)) {
                outputDiv.innerHTML = "<p>Введите корректное колическтво книг.</p>";
                return;
            }

            if (index > 0) {
                if (index > bookCount) {
                    outputDiv.innerHTML = `<p>Некорректный номер книги (доступны книги с 1 по ${bookCount})</p>`;
                    return;
                }
                displayBook(books[index - 1], outputDiv);
            } else {
                let numBooks = Math.abs(index);
                numBooks = Math.min(numBooks, bookCount);т
                for (let i = 0; i < numBooks; i++) {
                    displayBook(books[i], outputDiv);
                }
            }
        }

        function displayBook(book, outputDiv) {
            let details = book.getElementsByTagName("details")[0].children;
            let labels = {
                "author": "Автор",
                "title": "Название",
                "year": "Год издания",
                "genre": "Жанр",
                "pages": "Количество страниц"
            };

            let output = `<h2>Информация о книге</h2><ul>`;
            for (let detail of details) {
                let label = labels[detail.tagName] || detail.tagName;
                output += `<li><strong>${label}:</strong> ${detail.textContent}</li>`;
            }
            output += `</ul>`;

            outputDiv.innerHTML += output;
        }
    </script>
</body>
</html>
