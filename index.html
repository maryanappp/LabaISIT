<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VK Друзья участников группы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>VK Друзья участников группы</h2>

        <label for="groupId">ID группы:</label>
        <input type="text" id="groupId" placeholder="например, appraisers_kpfu"><br><br>

        <label for="membersLimit">Сколько участников взять:</label>
        <input type="number" id="membersLimit" min="1" value="2"><br><br>

        <label for="friendsLimit">Сколько друзей у каждого:</label>
        <input type="number" id="friendsLimit" min="1" value="10"><br><br>

        <button onclick="fetchFriendsOfGroupMembers()">Получить список друзей</button>

        <pre id="output"></pre>
    </div>

    <script>
        const accessToken = "token"; 

        function vkApiRequest(method, params) {
            return new Promise((resolve, reject) => {
                const callbackName = "jsonpCallback_" + Math.random().toString(36).substr(2, 9);
                params["callback"] = callbackName;
                params["access_token"] = accessToken;
                params["v"] = "5.131";

                const script = document.createElement("script");
                script.src = `https://api.vk.com/method/${method}?${new URLSearchParams(params)}`;

                window[callbackName] = function(data) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    data.error ? reject(data.error) : resolve(data.response);
                };

                document.body.appendChild(script);
            });
        }

        async function getGroupId(groupIdentifier) {
            let data = await vkApiRequest("groups.getById", { group_id: groupIdentifier });
            return data[0]?.id;
        }

        async function getUserInfo(userIds) {
            if (userIds.length === 0) return {};
            let data = await vkApiRequest("users.get", { user_ids: userIds.join(","), fields: "first_name,last_name" });
            return Object.fromEntries(data.map(user => [user.id, `${user.first_name} ${user.last_name}`]));
        }

        async function fetchFriendsOfGroupMembers() {
            const groupIdentifier = document.getElementById("groupId").value.trim();
            const membersLimit = parseInt(document.getElementById("membersLimit").value, 10);
            const friendsPerUser = parseInt(document.getElementById("friendsLimit").value, 10);

            if (!groupIdentifier) return alert("Введите ID группы!");
            if (membersLimit < 1 || friendsPerUser < 1) return alert("Введите корректные числа!");

            document.getElementById("output").textContent = "Загрузка...";

            try {
                let groupId = await getGroupId(groupIdentifier);
                if (!groupId) throw new Error("Ошибка: не удалось получить ID группы.");

                let membersData = await vkApiRequest("groups.getMembers", { group_id: groupId, count: membersLimit });
                let members = membersData.items.slice(0, membersLimit);
                let membersInfo = await getUserInfo(members);

                let friendsList = [];
                let closedProfiles = 0;

                for (let userId of members) {
                    let userName = membersInfo[userId] || "Неизвестный";

                    let friendsData;
                    try {
                        friendsData = await vkApiRequest("friends.get", { user_id: userId });
                    } catch (error) {
                        if (error.error_code === 30) {
                            closedProfiles++;
                            friendsList.push({
                                userId,
                                userName,
                                closed: true
                            });
                            continue;
                        } else {
                            continue;
                        }
                    }

                    let friendsToShow = friendsData.items.slice(0, friendsPerUser);
                    let friendsInfo = await getUserInfo(friendsToShow);

                    friendsList.push({
                        userId,
                        userName,
                        closed: false,
                        friends: friendsToShow.map(friendId => ({
                            id: friendId,
                            name: friendsInfo[friendId] || "Неизвестный"
                        }))
                    });
                }

                let outputText = `Показано участников: ${friendsList.length}\n\n`;
                let friendCount = 1;

                friendsList.forEach((user, index) => {
                    outputText += `${index + 1}. ${user.userId} ${user.userName}\n`;

                    if (user.closed) {
                        outputText += `Аккаунт закрыт, друзья недоступны.\n\n`;
                    } else {
                        outputText += `Его друзья:\n`;
                        user.friends.forEach(friend => {
                            outputText += `   ${friendCount}) ${friend.id} ${friend.name}\n`;
                            friendCount++;
                        });
                        outputText += `\n`;
                    }
                });

                if (closedProfiles > 0) {
                    outputText += `⚠️ Закрытых аккаунтов: ${closedProfiles}\n`;
                }

                document.getElementById("output").textContent = outputText;
            } catch (error) {
                console.error("Ошибка:", error);
                document.getElementById("output").textContent = "Ошибка при загрузке данных.";
            }
        }
    </script>
</body>
</html>
